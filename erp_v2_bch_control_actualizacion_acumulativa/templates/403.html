{% extends "base.html" %}

{% block title %}Acceso no autorizado{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
        <section class="card border-0 shadow-sm">
            <div class="card-body p-4 p-lg-5 text-center">
                <div class="display-5 fw-bold text-danger mb-2">403</div>
                <h1 class="h3 mb-3">No tienes permiso para acceder</h1>
                <p class="text-secondary mb-4">
                    Tu sesión está activa, pero tu rol no permite abrir esta página.
                    Si consideras que es un error, comunícate con Administración.
                </p>
                <a href="{{ url_for('auth.dashboard') }}" class="btn btn-primary">
                    Volver al panel
                </a>
            </div>
        </section>
    </div>
</div>
{% endblock %}
